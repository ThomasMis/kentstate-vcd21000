<!DOCTYPE html>

<html>

<head>
    <title>Tom</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oi&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Yesteryear&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=BBH+Bartle&family=Yesteryear&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .upper {
            height: 95vh;
            background-image: url("https://www.personal.kent.edu/~tmis//images/seattle2.jpg");
            background-size: cover;
            color: white;
            font-size: 4rem;
            line-height: 0.75;
        }

        .upper-inner {
            background-color: rgba(0, 0, 0, 0.431);
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .upper-text {
            text-align: center;
        }

        .lower {
            display: flex;
            justify-content: center;
            background-color: #EFAB00;
            padding: 3rem;
            gap: 3rem;
        }

        .lower ul {
            list-style: none;
            text-align: right;
            border-top: 1px solid black;
            padding-top: 1rem;
        }

        .lower div {
            flex: 1;
        }



        a {
            color: black;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        svg {
            width: 50px;
        }

        #hello {
            font-family: "Yesteryear", serif;
            text-align: left;
            color: #EFAB00;
        }

        #kent {
            font-family: "Oi", serif;
            font-size: 6rem;
        }

        #state {
            font-family: "BBH Bartle", sans-serif;
        }

        svg {
            fill: white;
        }

        h2 {
            font-family: "BBH Bartle", sans-serif;
            padding-bottom: 1rem;
        }
    </style>
</head>

<body>
    <div class="upper">
        <div class="upper-inner">
            <div class="upper-text">
                <p id="hello">Hello</p>
                <p id="kent">Kent</p>
                <p id="state">State</p>

                    viewBox="0 0 640 640"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->

                </svg>
            </div>
        </div>
    </div>

    <div class="lower">
        <div>
            <h2>Courses</h2>
            <ul>
                <li><a href="https://www.kent.edu">Kent State University</a></li>
                <li><a href="https://www.kent.edu">Kent State University</a></li>
                <li><a href="https://www.kent.edu">Kent State University</a></li>
            </ul>
        </div>

        <div>
            <h2>Kent State</h2>
            <ul>
                <li><a href="https://www.kent.edu">Kent State University</a></li>
                <li><a href="https://www.kent.edu">Kent State University</a></li>
                <li><a href="https://www.kent.edu">Kent State University</a></li>
            </ul>

</html>
